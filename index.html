<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de IMC</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Sistema de IMC</h1>
        <p>Cadastre uma pessoa e calcule seu Índice de Massa Corporal.</p>
    </header>

    <main>

        <section class="card">

            <h2>Cadastro</h2>

            <label>Nome</label>
            <input type="text" id="nome">

            <label>Peso (kg)</label>
            <input type="number" id="peso">

            <label>Altura (cm)</label>
            <input type="number" id="altura">

            <button id="btnCalcular">Calcular IMC</button>
            <button id="btnLimpar">Limpar</button>

        </section>

        <section class="card">

            <h2>Resultado</h2>

            <div id="resultado">
                O resultado aparecerá aqui.
            </div>

        </section>

        <section class="card">

            <h2>
                Pessoas cadastradas:
                <span id="totalPessoas">0</span>
            </h2>

            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar pessoa..."
            >

            <div id="listaPessoas">
                <p>Nenhuma pessoa cadastrada ainda.</p>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
